name: Progressive texture contracts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  changes:
    uses: ./.github/workflows/ci-selection.yml
  contracts:
    needs: changes
    if: needs.changes.outputs.families == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tests/progressive_fixtures.py
      - run: dotnet run --project tests/TextureFamilies.Tests -c Debug
      - run: dotnet run --project tests/TextureFamilies.Tests -c Release
