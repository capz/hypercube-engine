name: Progressive texture contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tests/progressive_fixtures.py
      - run: python3 -m unittest discover -s tests -p test_progressive_textures.py
      - run: dotnet run --project tests/TextureFamilies.Tests -c Debug
      - run: dotnet run --project tests/TextureFamilies.Tests -c Release
