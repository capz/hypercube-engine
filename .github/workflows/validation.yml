name: Packed scene in Dolphin
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: capz/DolphinDotNet
          ref: 4728b40a00f389b06ea2482e84c244b8b1d0570e
          path: vendor/sdk
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and test packed assets, scheduler and GameCube executable
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          FIXTURE_RESOLUTION: '48'
        run: tools/build_validation.sh
      - name: Verify native resource API ranges and checksums
        run: |
          make -C vendor/sdk/tests mesh_range_test native_buffer_crc_test
          vendor/sdk/tests/mesh_range_test
          vendor/sdk/tests/native_buffer_crc_test
      - name: Build Dolphin validation container
        run: docker build -t hypercube-dolphin -f tools/Dockerfile.dolphin .
      - name: Boot the DOL and run all eleven scene comparisons
        run: >-
          docker run --rm --init --shm-size=512m --user "$(id -u):$(id -g)"
          --mount "type=bind,src=$PWD,dst=/work" -w /work hypercube-dolphin
          python3 tools/dolphin_validation.py out/native-${{ matrix.configuration }}/Game.dol
          --disc out/assets/world.iso --logs out/dolphin-${{ matrix.configuration }} --seconds 240
      - name: Build performance comparison executable
        if: matrix.configuration == 'Release'
        env:
          PERFORMANCE_SUITE: '1'
        run: tools/build_validation.sh
      - name: Run nine performance comparisons and progress checks
        if: matrix.configuration == 'Release'
        run: >-
          docker run --rm --init --shm-size=512m --user "$(id -u):$(id -g)"
          --mount "type=bind,src=$PWD,dst=/work" -w /work hypercube-dolphin
          python3 tools/dolphin_validation.py out/native-performance-Release/Game.dol
          --suite performance --disc out/assets/world.iso
          --logs out/dolphin-performance-Release --seconds 240
      - name: Build frame-phase profiling executable
        if: matrix.configuration == 'Release'
        env:
          PROFILING_SUITE: '1'
        run: tools/build_validation.sh
      - name: Run sixteen engine/SDK throughput comparisons
        if: matrix.configuration == 'Release'
        run: >-
          docker run --rm --init --shm-size=512m --user "$(id -u):$(id -g)"
          --mount "type=bind,src=$PWD,dst=/work" -w /work hypercube-dolphin
          python3 tools/dolphin_validation.py out/native-profiling-Release/Game.dol
          --suite profiling --disc out/assets/world.iso
          --logs out/dolphin-profiling-Release --seconds 360
      - name: Build SDK follow-up profiling executable
        if: matrix.configuration == 'Release'
        env:
          SDK_FOLLOWUP_SUITE: '1'
        run: tools/build_validation.sh
      - name: Run sixteen SDK wait and direct-read comparisons
        if: matrix.configuration == 'Release'
        run: >-
          docker run --rm --init --shm-size=512m --user "$(id -u):$(id -g)"
          --mount "type=bind,src=$PWD,dst=/work" -w /work hypercube-dolphin
          python3 tools/dolphin_validation.py out/native-sdk-followup-Release/Game.dol
          --suite sdk-followup --disc out/assets/world.iso
          --logs out/dolphin-sdk-followup-Release --seconds 360
      - name: Build texture follow-up profiling executable
        if: matrix.configuration == 'Release'
        env:
          TEXTURE_FOLLOWUP_SUITE: '1'
        run: tools/build_validation.sh
      - name: Run sixteen clear, wait and aligned-read comparisons
        if: matrix.configuration == 'Release'
        run: >-
          docker run --rm --init --shm-size=512m --user "$(id -u):$(id -g)"
          --mount "type=bind,src=$PWD,dst=/work" -w /work hypercube-dolphin
          python3 tools/dolphin_validation.py out/native-texture-followup-Release/Game.dol
          --suite texture-followup --disc out/assets/world.iso
          --logs out/dolphin-texture-followup-Release --seconds 480
      - name: Upload executable, assets, measurements and rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hypercube-validation-${{ matrix.configuration }}
          path: |
            out/native-*/Game.dol
            out/native-*/Game.elf
            out/assets/
            out/dolphin-*/*.csv
            out/dolphin-*/*.md
            out/dolphin-*/*.json
            out/dolphin-*/*.png
            out/dolphin-*/*.log
            out/dolphin-*/user/Logs/
            out/dolphin-*/user/Dump/Audio/
          retention-days: 14
