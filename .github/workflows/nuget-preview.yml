name: NuGet preview
on:
  pull_request:
    paths:
      - 'src/**'
      - 'eng/**'
      - 'tests/nuget_consumer.py'
      - 'Directory.Build.props'
      - 'LICENSE'
      - '.github/workflows/nuget-preview.yml'
  push:
    tags: ['nuget-preview-*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified preview packages to NuGet.org
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: sdk
        run: echo "revision=$(cat .sdk-revision)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          repository: capz/DolphinDotNet
          ref: ${{ steps.sdk.outputs.revision }}
          path: vendor/sdk
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: version
        run: echo "version=0.1.0-preview.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Pack against the published SDK
        if: github.event_name != 'pull_request'
        run: python3 eng/pack.py --version '${{ steps.version.outputs.version }}'
      - name: Verify the exact pinned SDK before its release
        if: github.event_name == 'pull_request'
        run: python3 eng/pack.py --sdk-source vendor/sdk --version '${{ steps.version.outputs.version }}'
      - name: Verify relocated packages and external consumers
        run: python3 tests/nuget_consumer.py --workspace "$RUNNER_TEMP/external engine consumer" --native
      - uses: actions/upload-artifact@v4
        with:
          name: hypercube-nuget-preview
          path: |
            out/packages/*.nupkg
            out/packages/packages.json
            out/packages/sdk-feed/*.nupkg
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/nuget-preview-') || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
    needs: verify
    runs-on: ubuntu-24.04
    environment: nuget-preview
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: hypercube-nuget-preview
          path: packages
      - name: Authenticate to NuGet.org using trusted publishing
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: capz
      - name: Publish the exact verified artifacts
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          python3 -c 'import json; assert not json.load(open("packages/packages.json")).get("sdkSourcePreview"), "Publish the pinned SDK before distributing engine packages"'
          test -n "$NUGET_API_KEY"
          dotnet nuget push packages/Capz.Hypercube.Core.*.nupkg --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
          dotnet nuget push packages/Capz.Hypercube.GameCube.*.nupkg --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
